<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NSE F&O Options Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0A0D14;
      --surface-dark: #121722;
      --surface-elevated: #1B2232;
      --surface-border: #263147;
      --call-green: #00E676;
      --call-green-bg: rgba(0, 230, 118, 0.12);
      --put-red: #FF3B69;
      --put-red-bg: rgba(255, 59, 105, 0.12);
      --gold-accent: #FFD54F;
      --intraday-amber: #FF9800;
      --intraday-amber-bg: rgba(255, 152, 0, 0.16);
      --positional-purple: #7C4DFF;
      --positional-purple-bg: rgba(124, 77, 255, 0.16);
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Market Bar */
    .market-header {
      background: var(--surface-dark);
      border-bottom: 1px solid var(--surface-border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .ticker-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      white-space: nowrap;
    }

    .ticker-name {
      font-weight: 700;
      color: var(--text-secondary);
    }

    .ticker-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: var(--text-primary);
    }

    .bg-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid var(--call-green);
      color: var(--call-green);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--call-green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 8px var(--call-green); }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* Secondary Controls / Filter Bar */
    .filter-bar {
      background: var(--surface-dark);
      border-bottom: 1px solid var(--surface-border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }

    .filter-group {
      display: flex;
      gap: 6px;
    }

    .filter-chip {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--surface-border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: var(--call-green);
      color: #000;
      border-color: var(--call-green);
    }

    .filter-chip.pe-active {
      background: var(--put-red);
      color: #fff;
      border-color: var(--put-red);
    }

    .scan-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #FFB300, #FF6F00);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 179, 0, 0.3);
    }

    .scan-btn:active {
      transform: scale(0.97);
    }

    /* Main Scroll Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Strategy Banner */
    .strategy-banner {
      background: var(--surface-dark);
      border: 1px solid var(--intraday-amber);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .strategy-banner.positional-banner {
      border-color: var(--positional-purple);
    }

    .banner-icon {
      font-size: 20px;
    }

    .banner-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--intraday-amber);
      margin-bottom: 3px;
    }

    .positional-banner .banner-title {
      color: var(--positional-purple);
    }

    .banner-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Signal Card */
    .signal-card {
      background: var(--surface-dark);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .signal-card.intraday-card {
      border-left: 4px solid var(--intraday-amber);
    }

    .signal-card.positional-card {
      border-left: 4px solid var(--positional-purple);
    }

    /* Distinct Top Header Badges */
    .card-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-intraday-mis {
      background: var(--intraday-amber-bg);
      color: var(--intraday-amber);
      border: 1px solid var(--intraday-amber);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-positional-nrml {
      background: var(--positional-purple-bg);
      color: var(--positional-purple);
      border: 1px solid var(--positional-purple);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-option-type {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .badge-ce {
      background: var(--call-green-bg);
      color: var(--call-green);
      border: 1px solid var(--call-green);
    }

    .badge-pe {
      background: var(--put-red-bg);
      color: var(--put-red);
      border: 1px solid var(--put-red);
    }

    .expiry-indicator-bar {
      background: var(--surface-elevated);
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .countdown-timer {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--intraday-amber);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .holding-indicator {
      font-weight: 700;
      color: var(--positional-purple);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stock-symbol {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .strike-title {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .card-right-metric {
      text-align: right;
    }

    .current-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 800;
    }

    .pnl-badge {
      font-size: 11px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Levels Grid */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--surface-elevated);
      padding: 10px;
      border-radius: 10px;
    }

    .level-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .level-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .level-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
    }

    .level-sub {
      font-size: 8px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Target Meter Bar */
    .target-meter-wrap {
      background: var(--surface-elevated);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meter-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background: #232B3E;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .meter-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .fill-intraday {
      background: linear-gradient(90deg, var(--intraday-amber), #FFC107);
    }

    .fill-positional {
      background: linear-gradient(90deg, var(--positional-purple), #9575CD);
    }

    .risk-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .rr-tag {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
      font-weight: 700;
    }

    .sl-pct-pill {
      background: rgba(255, 59, 105, 0.15);
      color: var(--put-red);
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
    }

    .confluence-list {
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 8px;
      font-size: 10px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 3px;
      line-height: 1.4;
    }

    .conf-item::before {
      content: "✓ ";
      color: var(--call-green);
      font-weight: 800;
    }

    /* Actions Row */
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-trade-1click {
      flex: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--intraday-amber);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-trade-1click.positional-trade {
      background: var(--positional-purple);
      color: #fff;
    }

    .btn-telegram {
      background: var(--surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--surface-border);
      font-weight: 700;
      font-size: 11px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      background: var(--surface-dark);
      border-top: 1px solid var(--surface-border);
      display: flex;
      justify-content: space-around;
      padding: 6px 0;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .nav-item.active {
      color: var(--call-green);
      background: rgba(0, 230, 118, 0.08);
    }

    .nav-icon {
      font-size: 17px;
    }

    /* Radar Table */
    .radar-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stock-radar-card {
      background: var(--surface-dark);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 12px;
    }

    /* Settings & Studio Form */
    .settings-panel {
      background: var(--surface-dark);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .form-input {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 10px 12px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--call-green);
    }

    /* Modal / Order Confirmation Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: var(--surface-dark);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .payload-box {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gold-accent);
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-confirm-order {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: var(--call-green);
      color: #000;
      font-weight: 800;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-cancel-order {
      padding: 12px 18px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-secondary);
      font-weight: 700;
      cursor: pointer;
    }

    /* Toast Notification */
    #toast-msg {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #1E293B;
      border: 1px solid var(--call-green);
      color: #FFF;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
      white-space: nowrap;
    }
  </style>
</head>

  <!-- Top Market Ticker Bar -->
  <div class="market-header">

      <div class="ticker-item">

      <div class="ticker-item">

    <div class="bg-badge" id="bg-toggle" onclick="toggleBackgroundService()">
      <div class="pulse-dot"></div>

  <!-- Sub-Header Filter Bar -->
  <div class="filter-bar" id="subfilter-bar">

  <!-- Main Dynamic Content Container -->
  <div class="content-area" id="main-content">

  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">

      <span>Python & NLP</span>
    </button>
    <button class="nav-item" onclick="switchTab('RADAR', this)">
      <span class="nav-icon">📡</span>
      <span>F&O Radar</span>
    </button>
    <button class="nav-item" onclick="switchTab('TELEGRAM', this)">
      <span class="nav-icon">✈️</span>
      <span>Telegram</span>
    </button>
    <button class="nav-item" onclick="switchTab('PERFORMANCE', this)">
      <span class="nav-icon">📊</span>
      <span>Audit</span>
    </button>
  </div>

  <!-- 1-Click Order Confirmation Modal -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-order-title">
        <span>🛒</span> 1-Click Broker Order (SmartAPI / Kite)
      </div>
      <div style="font-size: 12px; color: var(--text-secondary);" id="modal-order-desc">
        Confirm instantaneous order routing with mapped product type:
      </div>
      <div class="payload-box" id="modal-order-payload">
        <!-- JSON payload -->
      </div>
      <div style="font-size: 11px; color: var(--text-muted);" id="modal-order-note">
        • Automatically mapped setup to product type.
      </div>
      <div class="modal-actions">
        <button class="btn-cancel-order" onclick="closeOrderModal()">Cancel</button>
        <button class="btn-confirm-order" id="btn-execute-order" onclick="confirmExecuteOrder()">Confirm Buy Order</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-msg">Alert Notification</div>

    let isBgRunning = true;

      },
      {
        id: 3,

        companyName: 'Tata Motors Ltd',

    function calculateTimeUntil315() {
      const now = new Date();
      const target = new Date();
      target.setHours(15, 15, 0, 0);
      let diff = target - now;
      if (diff <= 0) return 'Market Closed';
      const hours = Math.floor(diff / (1000 * 60 * 60));
      diff %= (1000 * 60 * 60);
      const mins = Math.floor(diff / (1000 * 60));
      diff %= (1000 * 60);
      const secs = Math.floor(diff / 1000);
      return `${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`;
    }

    function testTelegramParser() {
      const input = document.getElementById('studio-tg-input').value;
      const resultBox = document.getElementById('studio-tg-result');
      
      // Basic regex replica matching python engine
      const regex = /(?:BUY|BUY\s+ABOVE|ENTRY)?\s*([A-Z0-9&-]+)\s+(\d+(?:\.\d+)?)\s+(CE|PE)\s*(?:@|AT|ABOVE)?\s*(\d+(?:\.\d+)?)\s*(?:SL|STOPLOSS)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(?:TGT|TARGETS?)\s*[:=]?\s*(\d+(?:\.\d+)?)(?:[/,\s]+(\d+(?:\.\d+)?))?/i;
      const match = input.match(regex);

      const isPositional = /(POSITIONAL|SWING|HOLDING)/i.test(input);
      const setupType = isPositional ? 'POSITIONAL' : 'INTRADAY';
      const productType = isPositional ? 'NRML' : 'MIS';

      if (match) {
        const symbol = match[1].toUpperCase();
        const strike = parseFloat(match[2]);
        const optType = match[3].toUpperCase();
        const entry = parseFloat(match[4]);
        const sl = parseFloat(match[5]);
        const t1 = parseFloat(match[6]);
        const t2 = match[7] ? parseFloat(match[7]) : parseFloat((entry + (entry - sl) * 2.5).toFixed(2));

        const parsed = {
          "status": "VALID_FNO_SYMBOL",
          "action": "BUY",
          "symbol": symbol,
          "strike": strike,
          "option_type": optType,
          "setup_type": setupType,
          "product_type": productType,
          "entry_price": entry,
          "stop_loss": sl,
          "target_1": t1,
          "target_2": t2,
          "timestamp": new Date().toISOString()
        };

        resultBox.innerText = JSON.stringify(parsed, null, 2);
        resultBox.style.color = 'var(--call-green)';
        showToast(`✅ Successfully parsed & mapped to ${productType}!`);
      } else {
        resultBox.innerText = 'Error: Unable to parse syntax. Ensure format resembles:\nBUY TATAMOTORS 1020 CE @ 24.5 SL 23.2 TGT 26.5/28 INTRADAY';
        resultBox.style.color = 'var(--put-red)';
      }
    }

            • <code>scanner/fno_symbols.py</code> (210+ NSE F&O master ticker validator)
          </div>
        `;
        container.appendChild(studio);
      } else if (currentTab === 'RADAR') {
        const radar = document.createElement('div');
        radar.className = 'radar-grid';
        radar.innerHTML = `
          <div class="strategy-banner" style="border-color: var(--call-green)">
            <span class="banner-icon">📡</span>
            <div>
              <div class="banner-title" style="color: var(--call-green)">210+ F&O LOW-SL RADAR</div>
              <div class="banner-desc">Live institutional VWAP proximity, Open Interest build-up & volume bursts to lock in minimal stop loss entries.</div>
            </div>
          </div>
          ${fnoStocks.map(s => {
            const isBull = s.trend === 'Bullish';
            const diff = (((s.price - s.vwap) / s.vwap) * 100).toFixed(1);
            return `
              <div class="stock-radar-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <div>
                    <span style="font-size: 15px; font-weight: 800;">${s.symbol}</span>
                    <span style="font-size: 11px; color: var(--text-secondary); margin-left: 6px;">${s.name}</span>
                  </div>
                  <div style="text-align: right;">
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800;">₹${s.price.toFixed(1)}</div>
                    <div style="font-size: 10px; font-weight: 700; color: ${isBull ? 'var(--call-green)' : 'var(--put-red)'}">${isBull ? '▲ Bullish' : '▼ Bearish'}</div>
                  </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; background: var(--surface-elevated); padding: 8px; border-radius: 8px; margin: 10px 0; font-size: 11px;">
                  <div>
                    <div style="font-size: 8px; color: var(--text-muted); font-weight: 700;">VWAP</div>
                    <div style="color: ${diff >= 0 ? 'var(--call-green)' : 'var(--put-red)'}; font-weight: 700;">₹${s.vwap.toFixed(0)} (${diff >= 0 ? '+' : ''}${diff}%)</div>
                  </div>
                  <div>
                    <div style="font-size: 8px; color: var(--text-muted); font-weight: 700;">OI CHG</div>
                    <div style="color: ${s.oiChg >= 0 ? 'var(--call-green)' : 'var(--put-red)'}; font-weight: 700;">${s.oiChg >= 0 ? '+' : ''}${s.oiChg}%</div>
                  </div>
                  <div>
                    <div style="font-size: 8px; color: var(--text-muted); font-weight: 700;">VOLUME</div>
                    <div style="color: ${s.vol >= 2.5 ? 'var(--gold-accent)' : 'var(--text-primary)'}; font-weight: 700;">${s.vol}x SMA</div>
                  </div>
                  <div>
                    <div style="font-size: 8px; color: var(--text-muted); font-weight: 700;">RSI 14</div>
                    <div style="font-weight: 700;">${s.rsi}</div>
                  </div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="btn-delete" style="flex: 1; border-color: var(--intraday-amber); color: var(--intraday-amber); font-weight: 700;" onclick="triggerScan()">⚡ Intraday Scan</button>
                  <button class="btn-delete" style="flex: 1; border-color: var(--positional-purple); color: var(--positional-purple); font-weight: 700;" onclick="triggerScan()">📆 Positional Scan</button>
                </div>
              </div>
            `;
          }).join('')}
        `;
        container.appendChild(radar);
      } else if (currentTab === 'TELEGRAM') {
        const settings = document.createElement('div');
        settings.className = 'settings-panel';
        settings.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: rgba(68, 138, 255, 0.2); padding: 8px; border-radius: 8px; font-size: 20px;">✈️</div>
            <div>
              <div style="font-size: 15px; font-weight: 800;">Telegram Bot & Channel Config</div>
              <div style="font-size: 11px; color: var(--text-muted);">Real-time CE/PE alert broadcast for Intraday and Positional setups</div>
            </div>
          </div>

          <div class="form-group">
            <label>Bot Token (from @BotFather)</label>
            <input type="text" class="form-input" id="tg-token" placeholder="e.g. 7123456789:AAHKu..." value="" />
          </div>

          <div class="form-group">
            <label>Chat ID or Channel Username</label>
            <input type="text" class="form-input" id="tg-chat" placeholder="e.g. -100123456789 or @MyOptionAlerts" value="" />
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; background: var(--surface-elevated); padding: 12px; border-radius: 8px;">
            <div>
              <div style="font-size: 13px; font-weight: 700;">Auto-Broadcast Alerts</div>
              <div style="font-size: 11px; color: var(--text-muted);">Dispatch to Telegram when setup meets minimum score</div>
            </div>
            <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--call-green);" />
          </div>

          <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="scan-btn" style="flex: 1; justify-content: center; background: #448AFF; color: white;" onclick="showToast('✅ Telegram Settings Saved Successfully!')">Save Settings</button>
            <button class="btn-delete" style="flex: 1; font-weight: 700;" onclick="showToast('✅ Test Ping Sent to Telegram!')">Test Connection</button>
          </div>
        `;
        container.appendChild(settings);
      } else if (currentTab === 'PERFORMANCE') {
        const perf = document.createElement('div');
        perf.innerHTML = `
          <div class="strategy-banner" style="border-color: var(--call-green)">
            <span class="banner-icon">🏆</span>
            <div>
              <div class="banner-title" style="color: var(--call-green)">LOW-SL SCANNER PERFORMANCE AUDIT</div>
              <div class="banner-desc">Evaluated across 1,420 historical trades with strict VWAP bounce and OI confirmation.</div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 0;">
            <div style="background: var(--surface-dark); border: 1px solid var(--surface-border); padding: 14px; border-radius: 10px; text-align: center;">
              <div style="font-size: 9px; color: var(--text-muted); font-weight: 700;">WIN RATE</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800; color: var(--call-green); margin-top: 4px;">89.2%</div>
            </div>
            <div style="background: var(--surface-dark); border: 1px solid var(--surface-border); padding: 14px; border-radius: 10px; text-align: center;">
              <div style="font-size: 9px; color: var(--text-muted); font-weight: 700;">AVG STOP LOSS</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800; color: var(--call-green); margin-top: 4px;">4.8%</div>
            </div>
            <div style="background: var(--surface-dark); border: 1px solid var(--surface-border); padding: 14px; border-radius: 10px; text-align: center;">
              <div style="font-size: 9px; color: var(--text-muted); font-weight: 700;">AVG RISK:REWARD</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800; color: var(--gold-accent); margin-top: 4px;">1:2.9</div>
            </div>
          </div>
        `;
        container.appendChild(perf);
      }
    }

    // Dynamic timer ticker
    setInterval(() => {
      document.querySelectorAll('.live-countdown').forEach(el => {
        el.innerText = calculateTimeUntil315();
      });

      const nifty = document.getElementById('nifty-spot');
      const bank = document.getElementById('bank-spot');
      if (nifty) {
        const delta = (Math.random() * 2 - 0.9).toFixed(1);
        const curr = parseFloat(nifty.innerText.replace(/,/g, ''));
        nifty.innerText = (curr + parseFloat(delta)).toLocaleString('en-IN', { minimumFractionDigits: 2 });
      }
      if (bank) {
        const delta = (Math.random() * 4 - 1.8).toFixed(1);
        const curr = parseFloat(bank.innerText.replace(/,/g, ''));
        bank.innerText = (curr + parseFloat(delta)).toLocaleString('en-IN', { minimumFractionDigits: 2 });
      }
    }, 1000);

    render();
  </script>
</body>
</html>
